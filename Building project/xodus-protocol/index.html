<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XODUS Protocol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..0"
    rel="stylesheet" />

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "@google/generative-ai": "https://esm.sh/@google/generative-ai",
        "@mysten/sui": "https://esm.sh/@mysten/sui",
        "@mysten/dapp-kit": "https://esm.sh/@mysten/dapp-kit",
        "@mysten/dapp-kit/dist/index.css": "https://esm.sh/@mysten/dapp-kit/dist/index.css",
        "@tanstack/react-query": "https://esm.sh/@tanstack/react-query"
      }
    }
  </script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#f2b90d',
            'background-dark': '#0a0a0a',
            'surface-dark': '#1a1812',
            'accent-red': '#ff4d4d',
          },
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #0a0a0a;
      color: #ffffff;
      margin: 0;
      overflow-x: hidden;
    }

    .scanline {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      opacity: 0.15;
    }

    .glow-text {
      text-shadow: 0 0 10px rgba(242, 185, 13, 0.5);
    }

    .neon-border {
      box-shadow: 0 0 15px rgba(242, 185, 13, 0.2);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #12110a;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #f2b90d;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="custom-scrollbar">
  <div id="root"></div>
  <div class="scanline"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
